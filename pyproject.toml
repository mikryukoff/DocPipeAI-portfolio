[project]
name = "docpipeai"
version = "0.1.0"
description = "Extract data from PDF/Excel/Word and generate pipeline passports"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.18.1",
    "environs>=14.5.0",
    "fastapi>=0.128.0",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "xlrd>=2.0.1",
    "pdfplumber>=0.11.8",
    "pydantic>=2.12.5",
    "pymorphy3>=2.0.6",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.21",
    "cryptography",
    "rarfile>=4.2",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
    "websockets>=16.0",
    "yandex-ai-studio-sdk>=0.19.2",
]

[project.optional-dependencies]
# Распознавание PDF (YOLO, Ollama, ocrmypdf и т.д.). Образ Docker собирается без этого набора.
ocr = [
    "ocrmypdf>=16.13.0",
    "ollama>=0.6.1",
    "huggingface-hub>=1.8.0",
    "opencv-contrib-python>=4.13.0.92",
    "pdf2image>=1.17.0",
    "pillow>=12.1.1",
    "ultralytics>=8.4.33",
]

[dependency-groups]
dev = [
    "pydeps>=3.0.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external services",
]
